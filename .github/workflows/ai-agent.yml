name: ai-agent

# Run the agent from the GitHub web UI:
# Actions tab -> ai-agent -> Run workflow -> type a prompt.
# Requires the ANTHROPIC_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the agent do?"
        required: true
        type: string
      commit_changes:
        description: "Commit and push any file changes the agent makes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ai-agent
        run: pip install -e .

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        # Prompt is passed via env var (not interpolated into the script)
        # to avoid shell/script injection from the input string.
        run: ai-agent -y "$PROMPT"

      - name: Commit changes made by the agent
        if: ${{ inputs.commit_changes }}
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          git config user.name "ai-agent"
          git config user.email "ai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ai-agent: $PROMPT"
            git push
          fi
