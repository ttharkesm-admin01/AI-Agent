[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "CLI tool-using AI agent powered by Claude, with a drop-in SKILL.md skills system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "moodavezaa" }]
dependencies = [
    "anthropic>=0.92.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-agent = "ai_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_agent*"]
